[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bookroom-sdk"
version = "1.0.0"
description = "Every Book Summarizer capability - extraction, study guides, JEv review, and PDF/Markdown/JSON exports - callable from your own Python code."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Book Summarizer" }]
keywords = ["summarizer", "study-guide", "pdf", "epub", "llm", "review", "sdk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
]

# The SDK itself is dependency-light. It drives the wrapped Book Summarizer
# application, so the application's own runtime dependencies must be installed
# into the same interpreter (see README, "Install").
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.24", "reportlab>=4.0", "Markdown>=3.5", "beautifulsoup4>=4.12"]
epub = ["ebooklib>=0.18", "beautifulsoup4>=4.12"]
ocr = ["pymupdf>=1.24"]
all = [
    "pymupdf>=1.24",
    "reportlab>=4.0",
    "Markdown>=3.5",
    "beautifulsoup4>=4.12",
    "ebooklib>=0.18",
]

[project.scripts]
bookroom = "bookroom_sdk.__main__:main"

[project.urls]
Documentation = "https://example.invalid/bookroom-sdk"

[tool.setuptools]
packages = ["bookroom_sdk"]

[tool.setuptools.package-data]
bookroom_sdk = ["py.typed"]
