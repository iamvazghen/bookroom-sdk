[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bookroom-sdk"
version = "2.0.0"
description = "Self-contained SDK for the Bookroom book summarizer: EPUB/PDF extraction, complete study guides, independent JEv review, and Markdown/PDF/JSON exports. The engine ships inside the package."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Bookroom" }]
keywords = ["summarizer", "study-guide", "pdf", "epub", "llm", "review", "sdk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
]

# Everything the bundled engine needs. `pip install bookroom-sdk` is enough:
# no separate checkout, no PYTHONPATH, no BOOKROOM_APP_ROOT.
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pymupdf>=1.24",        # PDF text extraction
    "reportlab>=4.0",       # PDF export
    "Markdown>=3.5",        # Markdown -> HTML for PDF export
    "beautifulsoup4>=4.12", # EPUB parsing + PDF HTML shaping
    "ebooklib>=0.18",       # EPUB parsing
]

[project.optional-dependencies]
# The alternate Ollama/OpenRouter transport (translation, chapter classification).
legacy = ["ollama>=0.6", "tqdm>=4.66"]
all = ["ollama>=0.6", "tqdm>=4.66"]

[project.scripts]
bookroom = "bookroom_sdk.__main__:main"

[project.urls]
Homepage = "https://github.com/iamvazghen/bookroom-sdk"
Repository = "https://github.com/iamvazghen/bookroom-sdk"

[tool.setuptools]
packages = ["bookroom_sdk"]

[tool.setuptools.package-data]
# The engine is data, not a subpackage: it is imported by bare top-level name
# (the upstream modules do `from book_pipeline import ...`), so the SDK puts
# this directory on sys.path at load time. It must ship inside the wheel.
bookroom_sdk = ["_engine/*.py", "_engine/PROVENANCE.md", "py.typed"]
