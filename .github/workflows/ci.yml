name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          pip install "./python[all]"

      - name: Import check - the engine must resolve with no configuration
        run: |
          python - <<'PY'
          from bookroom_sdk import Bookroom
          room = Bookroom(llm_api_key="x", jev_api_key="y")
          root = room.load()
          print("engine root:", root)
          assert "_engine" in str(root), f"bundled engine not used: {root}"
          assert len(room.describe()["capabilities"]) >= 35
          print("capabilities:", len(room.describe()["capabilities"]))
          PY

      - name: Console entry point
        run: bookroom --version

      - name: Unit and integration suites
        run: |
          python verify_sdk.py
          python verify_facade.py
          python verify_examples.py

  typescript:
    name: TypeScript (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the Python SDK
        # The facade that these clients talk to ships inside the Python package,
        # so it has to be installed before the client can be exercised against it.
        run: |
          python -m pip install --upgrade pip
          pip install "./python[all]"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      - name: TypeScript client against the live facade
        run: python verify_typescript.py
        shell: bash

  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Build the wheel and sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build ./python
          python -m twine check ./python/dist/*

      - name: Confirm the engine ships inside the wheel
        run: |
          python - <<'PY'
          import glob, zipfile
          wheels = glob.glob("python/dist/*.whl")
          assert wheels, "no wheel built"
          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
          engine = [n for n in names if "bookroom_sdk/_engine/" in n]
          print(f"engine files in wheel: {len(engine)}")
          assert len(engine) >= 19, f"engine missing from wheel: {len(engine)} files"
          assert any(n.endswith("book_pipeline.py") for n in engine)
          print("OK: the wheel is self-contained")
          PY

      - name: npm pack dry run
        run: |
          npm ci
          npm run build
          npm pack --dry-run

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure no credentials are committed
        run: |
          set -euo pipefail
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env is tracked by git"; exit 1
          fi
          if git grep -nEI '(AIza[0-9A-Za-z_-]{30,}|sk-[0-9A-Za-z]{30,}|gh[opsu]_[0-9A-Za-z]{30,})' \
             -- . ':!*.lock' ':!package-lock.json'; then
            echo "::error::a credential-shaped string is committed"; exit 1
          fi
          echo "OK: no credential-shaped strings in the tracked tree"
